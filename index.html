<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor Personal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    margin:0;
    background:#f4f6f8;
    color:#222;
}

.app{
    max-width:520px;
    margin:auto;
    padding:15px;
    padding-bottom:90px;
}

h1{
    font-size:24px;
    margin:10px 0 20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

input, select, button{
    width:100%;
    padding:14px;
    margin-top:8px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:16px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    font-weight:bold;
}

.btn-danger{
    background:#dc2626;
}

.btn-success{
    background:#16a34a;
}

.tarea{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.completada{
    border-left:8px solid #16a34a;
}

.enproceso{
    border-left:8px solid #f59e0b;
}

.pendiente{
    border-left:8px solid #2563eb;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#eef2ff;
    margin:4px 4px 4px 0;
    font-size:13px;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.metric{
    background:#f8fafc;
    padding:12px;
    border-radius:14px;
    text-align:center;
}

.metric strong{
    display:block;
    font-size:22px;
}

.usuario-card{
    background:#f8fafc;
    padding:12px;
    border-radius:14px;
    margin-top:10px;
}

.bottom-space{
    height:30px;
}
</style>
</head>

<body>

<div class="app">

<h1>📋 Gestor Personal</h1>

<div class="card">
    <h3>👤 Usuarios</h3>
    <input id="nuevoUsuario" type="text" placeholder="Nombre del usuario">
    <button onclick="agregarUsuario()">Agregar usuario</button>
</div>

<div class="card">
    <h3>➕ Nueva tarea</h3>

    <input id="titulo" type="text" placeholder="Escribe la tarea">

    <select id="prioridad">
        <option value="alta">Prioridad alta</option>
        <option value="media">Prioridad media</option>
        <option value="baja">Prioridad baja</option>
    </select>

    <input type="date" id="fechaLimite">

    <select id="usuarioAsignado">
        <option value="">Sin asignar</option>
    </select>

    <button onclick="agregarTarea()">Guardar tarea</button>
</div>

<div class="card">
    <h3>📊 Dashboard</h3>

    <select id="periodoDashboard" onchange="cargarCumplimiento()">
        <option value="hoy">Hoy</option>
        <option value="semana">Esta semana</option>
        <option value="mes">Este mes</option>
        <option value="todo">Todo</option>
    </select>

    <div id="cumplimiento"></div>
    <div id="estadisticas"></div>
</div>

<div class="card">
    <h3>🔎 Filtros</h3>

    <input type="text" id="buscador" placeholder="Buscar tarea..." onkeyup="cargarTareas()">

    <select id="filtroEstado" onchange="cargarTareas()">
        <option value="todas">Todas</option>
        <option value="pendiente">Pendientes</option>
        <option value="en proceso">En proceso</option>
        <option value="completada">Completadas</option>
    </select>

    <select id="filtroUsuario" onchange="cargarTareas()">
        <option value="todos">Todos los usuarios</option>
    </select>
</div>

<h3>📝 Tareas</h3>
<div id="listaTareas"></div>

<div class="bottom-space"></div>

</div>

<script>
let todasLasTareas = [];
let usuarios = [];

async function cargarUsuarios(){
    const respuesta = await fetch("/usuarios");
    usuarios = await respuesta.json();

    const usuarioAsignado = document.getElementById("usuarioAsignado");
    const filtroUsuario = document.getElementById("filtroUsuario");

    usuarioAsignado.innerHTML = `<option value="">Sin asignar</option>`;
    filtroUsuario.innerHTML = `<option value="todos">Todos los usuarios</option>`;

    usuarios.forEach(usuario => {
        usuarioAsignado.innerHTML += `<option value="${usuario.id}">${usuario.nombre}</option>`;
        filtroUsuario.innerHTML += `<option value="${usuario.id}">${usuario.nombre}</option>`;
    });
}

async function agregarUsuario(){
    const nombre = document.getElementById("nuevoUsuario").value;

    if(!nombre){
        alert("Escribe el nombre del usuario");
        return;
    }

    await fetch("/usuarios", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ nombre })
    });

    document.getElementById("nuevoUsuario").value = "";

    await cargarUsuarios();
    await cargarTareas();
}

async function agregarTarea(){
    const titulo = document.getElementById("titulo").value;
    const prioridad = document.getElementById("prioridad").value;
    const fechaLimite = document.getElementById("fechaLimite").value;
    const usuarioId = document.getElementById("usuarioAsignado").value;

    if(!titulo){
        alert("Escribe una tarea");
        return;
    }

    await fetch("/tareas", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ titulo, prioridad, fechaLimite, usuarioId })
    });

    document.getElementById("titulo").value = "";
    document.getElementById("fechaLimite").value = "";
    document.getElementById("usuarioAsignado").value = "";

    cargarTareas();
    cargarCumplimiento();
}

async function actualizarTarea(id){
    const titulo = document.getElementById(`titulo-${id}`).value;
    const prioridad = document.getElementById(`prioridad-${id}`).value;
    const estado = document.getElementById(`estado-${id}`).value;
    const fechaLimite = document.getElementById(`fecha-${id}`).value;
    const usuarioId = document.getElementById(`usuario-${id}`).value;

    await fetch(`/tareas/${id}`, {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ titulo, prioridad, estado, fechaLimite, usuarioId })
    });

    cargarTareas();
    cargarCumplimiento();
}

async function eliminarTarea(id){
    if(!confirm("¿Eliminar tarea?")) return;

    await fetch(`/tareas/${id}`, { method:"DELETE" });

    cargarTareas();
    cargarCumplimiento();
}

async function cargarTareas(){
    const respuesta = await fetch("/tareas");
    const tareas = await respuesta.json();

    todasLasTareas = tareas;
    let tareasFiltradas = [...tareas];

    const textoBusqueda = document.getElementById("buscador").value.toLowerCase();
    const filtroEstado = document.getElementById("filtroEstado").value;
    const filtroUsuario = document.getElementById("filtroUsuario").value;

    if(textoBusqueda){
        tareasFiltradas = tareasFiltradas.filter(t =>
            t.titulo.toLowerCase().includes(textoBusqueda)
        );
    }

    if(filtroEstado !== "todas"){
        tareasFiltradas = tareasFiltradas.filter(t => t.estado === filtroEstado);
    }

    if(filtroUsuario !== "todos"){
        tareasFiltradas = tareasFiltradas.filter(t => String(t.usuario_id) === filtroUsuario);
    }

    const ordenPrioridad = { alta:1, media:2, baja:3 };

    tareasFiltradas.sort((a,b) =>
        ordenPrioridad[a.prioridad] - ordenPrioridad[b.prioridad]
    );

    const lista = document.getElementById("listaTareas");
    lista.innerHTML = "";

    tareasFiltradas.forEach(tarea => {
        const div = document.createElement("div");

        div.className =
            tarea.estado === "completada"
            ? "tarea completada"
            : tarea.estado === "en proceso"
            ? "tarea enproceso"
            : "tarea pendiente";

        let opcionesUsuarios = `<option value="">Sin asignar</option>`;

        usuarios.forEach(usuario => {
            opcionesUsuarios += `
                <option value="${usuario.id}" ${tarea.usuario_id === usuario.id ? "selected" : ""}>
                    ${usuario.nombre}
                </option>
            `;
        });

        div.innerHTML = `
            <input id="titulo-${tarea.id}" value="${tarea.titulo}">

            <select id="prioridad-${tarea.id}">
                <option value="alta" ${tarea.prioridad === "alta" ? "selected" : ""}>Alta</option>
                <option value="media" ${tarea.prioridad === "media" ? "selected" : ""}>Media</option>
                <option value="baja" ${tarea.prioridad === "baja" ? "selected" : ""}>Baja</option>
            </select>

            <select id="estado-${tarea.id}">
                <option value="pendiente" ${tarea.estado === "pendiente" ? "selected" : ""}>Pendiente</option>
                <option value="en proceso" ${tarea.estado === "en proceso" ? "selected" : ""}>En proceso</option>
                <option value="completada" ${tarea.estado === "completada" ? "selected" : ""}>Completada</option>
            </select>

            <input type="date" id="fecha-${tarea.id}" value="${tarea.fecha_limite || ""}">

            <select id="usuario-${tarea.id}">
                ${opcionesUsuarios}
            </select>

            <div>
                <span class="badge">👤 ${tarea.usuario_nombre || "Sin asignar"}</span>
                <span class="badge">📅 ${tarea.fecha_limite || "Sin fecha"}</span>
                <span class="badge">⚡ ${tarea.prioridad}</span>
                <span class="badge">📌 ${tarea.estado}</span>
            </div>

            <button class="btn-success" onclick="actualizarTarea(${tarea.id})">
                Guardar cambios
            </button>

            <button class="btn-danger" onclick="eliminarTarea(${tarea.id})">
                Eliminar
            </button>
        `;

        lista.appendChild(div);
    });
}

async function cargarCumplimiento(){
    const periodo = document.getElementById("periodoDashboard").value;

    const respuesta = await fetch(`/dashboard?periodo=${periodo}`);
    const datos = await respuesta.json();

    document.getElementById("cumplimiento").innerHTML =
        `<h2>🎯 ${datos.general.cumplimiento}%</h2>`;

    let html = `
        <div class="dashboard-grid">
            <div class="metric"><strong>${datos.general.total}</strong>Programadas</div>
            <div class="metric"><strong>${datos.general.completadas}</strong>Completadas</div>
            <div class="metric"><strong>${datos.general.enProceso}</strong>En proceso</div>
            <div class="metric"><strong>${datos.general.pendientes}</strong>Pendientes</div>
        </div>

        <h3>Por usuario</h3>
    `;

    if(datos.usuarios.length === 0){
        html += `<p>No hay tareas para este periodo.</p>`;
    }

    datos.usuarios.forEach(usuario => {
        html += `
            <div class="usuario-card">
                <strong>${usuario.usuario}</strong><br>
                🎯 Cumplimiento: ${usuario.cumplimiento}%<br>
                📋 Programadas: ${usuario.total}<br>
                ✅ Completadas: ${usuario.completadas}<br>
                🔄 En proceso: ${usuario.enProceso}<br>
                ⏳ Pendientes: ${usuario.pendientes}
            </div>
        `;
    });

    document.getElementById("estadisticas").innerHTML = html;
}

async function iniciar(){
    await cargarUsuarios();
    await cargarTareas();
    await cargarCumplimiento();
}

iniciar();
</script>

</body>
</html>
