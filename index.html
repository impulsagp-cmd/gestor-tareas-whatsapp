<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Gestor Personal</title>

<style>
body{
    font-family:Arial;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

input, select, button{
    padding:10px;
    margin:5px;
}

button{
    cursor:pointer;
}

.tarea{
    border:1px solid #ccc;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
}

.completada{
    background:#dff0d8;
}

.enproceso{
    background:#fff3cd;
}

#dashboard, #usuariosBox{
    border:1px solid #ddd;
    padding:15px;
    margin-top:20px;
    margin-bottom:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>📋 Mi Gestor Personal</h1>

<div id="usuariosBox">
    <h2>Usuarios</h2>

    <input id="nuevoUsuario" type="text" placeholder="Nombre del usuario">

    <button onclick="agregarUsuario()">
        Agregar usuario
    </button>
</div>

<input type="text" id="buscador" placeholder="Buscar tarea..." onkeyup="cargarTareas()">

<select id="filtroEstado" onchange="cargarTareas()">
    <option value="todas">Todas</option>
    <option value="pendiente">Pendientes</option>
    <option value="en proceso">En proceso</option>
    <option value="completada">Completadas</option>
</select>

<select id="filtroUsuario" onchange="cargarTareas()">
    <option value="todos">Todos los usuarios</option>
</select>

<br>

<input id="titulo" type="text" placeholder="Nueva tarea">

<select id="prioridad">
    <option value="alta">Alta</option>
    <option value="media">Media</option>
    <option value="baja">Baja</option>
</select>

<input type="date" id="fechaLimite">

<select id="usuarioAsignado">
    <option value="">Sin asignar</option>
</select>

<button onclick="agregarTarea()">Agregar tarea</button>

<div id="dashboard">
    <h2>Dashboard</h2>
    <select id="periodoDashboard" onchange="cargarCumplimiento()">
    <option value="hoy">Hoy</option>
    <option value="semana">Esta semana</option>
    <option value="mes">Este mes</option>
    <option value="todo">Todo</option>
</select>
    <div id="cumplimiento">Cumplimiento: 0%</div>
    <div id="estadisticas"></div>
</div>

<h2>Tareas</h2>
<div id="listaTareas"></div>

<script>
let todasLasTareas = [];
let usuarios = [];

async function cargarUsuarios(){
    const respuesta = await fetch("/usuarios");
    usuarios = await respuesta.json();

    const usuarioAsignado = document.getElementById("usuarioAsignado");
    const filtroUsuario = document.getElementById("filtroUsuario");

    usuarioAsignado.innerHTML = `<option value="">Sin asignar</option>`;
    filtroUsuario.innerHTML = `<option value="todos">Todos los usuarios</option>`;

    usuarios.forEach(usuario => {
        usuarioAsignado.innerHTML += `
            <option value="${usuario.id}">
                ${usuario.nombre}
            </option>
        `;

        filtroUsuario.innerHTML += `
            <option value="${usuario.id}">
                ${usuario.nombre}
            </option>
        `;
    });
}

async function agregarUsuario(){
    const nombre = document.getElementById("nuevoUsuario").value;

    if(!nombre){
        alert("Escribe el nombre del usuario");
        return;
    }

    await fetch("/usuarios", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ nombre })
    });

    document.getElementById("nuevoUsuario").value = "";

    await cargarUsuarios();
    await cargarTareas();
}

async function agregarTarea(){
    const titulo = document.getElementById("titulo").value;
    const prioridad = document.getElementById("prioridad").value;
    const fechaLimite = document.getElementById("fechaLimite").value;
    const usuarioId = document.getElementById("usuarioAsignado").value;

    if(!titulo){
        alert("Escribe una tarea");
        return;
    }

    await fetch("/tareas", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            titulo,
            prioridad,
            fechaLimite,
            usuarioId
        })
    });

    document.getElementById("titulo").value = "";
    document.getElementById("fechaLimite").value = "";
    document.getElementById("usuarioAsignado").value = "";

    cargarTareas();
    cargarCumplimiento();
}

async function actualizarTarea(id){
    const titulo = document.getElementById(`titulo-${id}`).value;
    const prioridad = document.getElementById(`prioridad-${id}`).value;
    const estado = document.getElementById(`estado-${id}`).value;
    const fechaLimite = document.getElementById(`fecha-${id}`).value;
    const usuarioId = document.getElementById(`usuario-${id}`).value;

    await fetch(`/tareas/${id}`, {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            titulo,
            prioridad,
            estado,
            fechaLimite,
            usuarioId
        })
    });

    cargarTareas();
    cargarCumplimiento();
}

async function eliminarTarea(id){
    if(!confirm("¿Eliminar tarea?")){
        return;
    }

    await fetch(`/tareas/${id}`, {
        method:"DELETE"
    });

    cargarTareas();
    cargarCumplimiento();
}

async function cargarTareas(){
    const respuesta = await fetch("/tareas");
    const tareas = await respuesta.json();

    todasLasTareas = tareas;

    let tareasFiltradas = [...tareas];

    const textoBusqueda = document.getElementById("buscador").value.toLowerCase();
    const filtroEstado = document.getElementById("filtroEstado").value;
    const filtroUsuario = document.getElementById("filtroUsuario").value;

    if(textoBusqueda){
        tareasFiltradas = tareasFiltradas.filter(t =>
            t.titulo.toLowerCase().includes(textoBusqueda)
        );
    }

    if(filtroEstado !== "todas"){
        tareasFiltradas = tareasFiltradas.filter(t =>
            t.estado === filtroEstado
        );
    }

    if(filtroUsuario !== "todos"){
        tareasFiltradas = tareasFiltradas.filter(t =>
            String(t.usuario_id) === filtroUsuario
        );
    }

    const ordenPrioridad = {
        alta: 1,
        media: 2,
        baja: 3
    };

    tareasFiltradas.sort((a,b) =>
        ordenPrioridad[a.prioridad] - ordenPrioridad[b.prioridad]
    );

    const lista = document.getElementById("listaTareas");
    lista.innerHTML = "";

    tareasFiltradas.forEach(tarea => {
        const div = document.createElement("div");

        div.className =
            tarea.estado === "completada"
            ? "tarea completada"
            : tarea.estado === "en proceso"
            ? "tarea enproceso"
            : "tarea";

        let opcionesUsuarios = `
            <option value="">Sin asignar</option>
        `;

        usuarios.forEach(usuario => {
            opcionesUsuarios += `
                <option value="${usuario.id}" ${tarea.usuario_id === usuario.id ? "selected" : ""}>
                    ${usuario.nombre}
                </option>
            `;
        });

        div.innerHTML = `
            <strong>Editar tarea</strong><br><br>

            <input id="titulo-${tarea.id}" value="${tarea.titulo}">

            <select id="prioridad-${tarea.id}">
                <option value="alta" ${tarea.prioridad === "alta" ? "selected" : ""}>Alta</option>
                <option value="media" ${tarea.prioridad === "media" ? "selected" : ""}>Media</option>
                <option value="baja" ${tarea.prioridad === "baja" ? "selected" : ""}>Baja</option>
            </select>

            <select id="estado-${tarea.id}">
                <option value="pendiente" ${tarea.estado === "pendiente" ? "selected" : ""}>Pendiente</option>
                <option value="en proceso" ${tarea.estado === "en proceso" ? "selected" : ""}>En proceso</option>
                <option value="completada" ${tarea.estado === "completada" ? "selected" : ""}>Completada</option>
            </select>

            <input type="date" id="fecha-${tarea.id}" value="${tarea.fecha_limite || ""}">

            <select id="usuario-${tarea.id}">
                ${opcionesUsuarios}
            </select>

            <br><br>

            Asignado a: ${tarea.usuario_nombre || "Sin asignar"}<br>
            Estado actual: ${tarea.estado}<br>
            Fecha límite: ${tarea.fecha_limite || "Sin fecha"}<br><br>

            <button onclick="actualizarTarea(${tarea.id})">Guardar cambios</button>
            <button onclick="eliminarTarea(${tarea.id})">Eliminar</button>
        `;

        lista.appendChild(div);
    });
}

async function cargarCumplimiento(){
    const periodo = document.getElementById("periodoDashboard").value;

    const respuesta = await fetch(`/dashboard?periodo=${periodo}`);
    const datos = await respuesta.json();

    document.getElementById("cumplimiento").innerHTML =
        `🎯 Cumplimiento ${periodo}: ${datos.general.cumplimiento}%`;

    let html = `
        <h3>Dashboard general</h3>
        📋 Programadas: ${datos.general.total}<br>
        ✅ Completadas: ${datos.general.completadas}<br>
        🔄 En proceso: ${datos.general.enProceso}<br>
        ⏳ Pendientes: ${datos.general.pendientes}<br>
        🎯 Cumplimiento: ${datos.general.cumplimiento}%<br><br>

        <h3>Dashboard por usuario</h3>
    `;

    if (datos.usuarios.length === 0) {
        html += `No hay tareas programadas para este periodo.`;
    }

    datos.usuarios.forEach(usuario => {
        html += `
            <div style="border:1px solid #ccc; padding:10px; margin:10px 0; border-radius:8px;">
                <strong>${usuario.usuario}</strong><br>
                📋 Programadas: ${usuario.total}<br>
                ✅ Completadas: ${usuario.completadas}<br>
                🔄 En proceso: ${usuario.enProceso}<br>
                ⏳ Pendientes: ${usuario.pendientes}<br>
                🎯 Cumplimiento: ${usuario.cumplimiento}%
            </div>
        `;
    });

    document.getElementById("estadisticas").innerHTML = html;
}

async function iniciar(){
    await cargarUsuarios();
    await cargarTareas();
    await cargarCumplimiento();
}

iniciar();
</script>

</body>
</html>
