<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Gestor Personal</title>

<style>
body{
    font-family:Arial;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

input, select, button{
    padding:10px;
    margin:5px;
}

button{
    cursor:pointer;
}

.tarea{
    border:1px solid #ccc;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
}

.completada{
    background:#dff0d8;
}

.enproceso{
    background:#fff3cd;
}

#dashboard{
    border:1px solid #ddd;
    padding:15px;
    margin-top:20px;
    margin-bottom:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>📋 Mi Gestor Personal</h1>

<input type="text" id="buscador" placeholder="Buscar tarea..." onkeyup="cargarTareas()">

<select id="filtroEstado" onchange="cargarTareas()">
    <option value="todas">Todas</option>
    <option value="pendiente">Pendientes</option>
    <option value="en proceso">En proceso</option>
    <option value="completada">Completadas</option>
</select>

<br>

<input id="titulo" type="text" placeholder="Nueva tarea">

<select id="prioridad">
    <option value="alta">Alta</option>
    <option value="media">Media</option>
    <option value="baja">Baja</option>
</select>

<input type="date" id="fechaLimite">

<button onclick="agregarTarea()">Agregar tarea</button>

<div id="dashboard">
    <h2>Dashboard</h2>
    <div id="cumplimiento">Cumplimiento: 0%</div>
    <div id="estadisticas"></div>
</div>

<h2>Tareas</h2>
<div id="listaTareas"></div>

<script>
let todasLasTareas = [];

async function agregarTarea(){
    const titulo = document.getElementById("titulo").value;
    const prioridad = document.getElementById("prioridad").value;
    const fechaLimite = document.getElementById("fechaLimite").value;

    if(!titulo){
        alert("Escribe una tarea");
        return;
    }

    await fetch("/tareas", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ titulo, prioridad, fechaLimite })
    });

    document.getElementById("titulo").value = "";
    document.getElementById("fechaLimite").value = "";

    cargarTareas();
    cargarCumplimiento();
}

async function actualizarTarea(id){
    const tarea = todasLasTareas.find(t => t.id === id);

    const titulo = document.getElementById(`titulo-${id}`).value;
    const prioridad = document.getElementById(`prioridad-${id}`).value;
    const estado = document.getElementById(`estado-${id}`).value;
    const fechaLimite = document.getElementById(`fecha-${id}`).value;

    await fetch(`/tareas/${id}`, {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            titulo,
            prioridad,
            estado,
            fechaLimite
        })
    });

    cargarTareas();
    cargarCumplimiento();
}

async function eliminarTarea(id){
    if(!confirm("¿Eliminar tarea?")){
        return;
    }

    await fetch(`/tareas/${id}`, {
        method:"DELETE"
    });

    cargarTareas();
    cargarCumplimiento();
}

async function cargarTareas(){
    const respuesta = await fetch("/tareas");
    const tareas = await respuesta.json();

    todasLasTareas = tareas;

    let tareasFiltradas = [...tareas];

    const textoBusqueda = document.getElementById("buscador").value.toLowerCase();
    const filtroEstado = document.getElementById("filtroEstado").value;

    if(textoBusqueda){
        tareasFiltradas = tareasFiltradas.filter(t =>
            t.titulo.toLowerCase().includes(textoBusqueda)
        );
    }

    if(filtroEstado !== "todas"){
        tareasFiltradas = tareasFiltradas.filter(t =>
            t.estado === filtroEstado
        );
    }

    const ordenPrioridad = {
        alta: 1,
        media: 2,
        baja: 3
    };

    tareasFiltradas.sort((a,b) =>
        ordenPrioridad[a.prioridad] - ordenPrioridad[b.prioridad]
    );

    const lista = document.getElementById("listaTareas");
    lista.innerHTML = "";

    tareasFiltradas.forEach(tarea => {
        const div = document.createElement("div");

        div.className =
            tarea.estado === "completada"
            ? "tarea completada"
            : tarea.estado === "en proceso"
            ? "tarea enproceso"
            : "tarea";

        div.innerHTML = `
            <strong>Editar tarea</strong><br><br>

            <input id="titulo-${tarea.id}" value="${tarea.titulo}">

            <select id="prioridad-${tarea.id}">
                <option value="alta" ${tarea.prioridad === "alta" ? "selected" : ""}>Alta</option>
                <option value="media" ${tarea.prioridad === "media" ? "selected" : ""}>Media</option>
                <option value="baja" ${tarea.prioridad === "baja" ? "selected" : ""}>Baja</option>
            </select>

            <select id="estado-${tarea.id}">
                <option value="pendiente" ${tarea.estado === "pendiente" ? "selected" : ""}>Pendiente</option>
                <option value="en proceso" ${tarea.estado === "en proceso" ? "selected" : ""}>En proceso</option>
                <option value="completada" ${tarea.estado === "completada" ? "selected" : ""}>Completada</option>
            </select>

            <input type="date" id="fecha-${tarea.id}" value="${tarea.fecha_limite || ""}">

            <br><br>

            Estado actual: ${tarea.estado}<br>
            Fecha límite: ${tarea.fecha_limite || "Sin fecha"}<br><br>

            <button onclick="actualizarTarea(${tarea.id})">Guardar cambios</button>
            <button onclick="eliminarTarea(${tarea.id})">Eliminar</button>
        `;

        lista.appendChild(div);
    });
}

async function cargarCumplimiento(){
    const respuesta = await fetch("/cumplimiento");
    const datos = await respuesta.json();

    document.getElementById("cumplimiento").innerHTML =
        `🎯 Cumplimiento: ${datos.cumplimiento}%`;

    document.getElementById("estadisticas").innerHTML =
        `
        📋 Total: ${datos.total}<br>
        ✅ Completadas: ${datos.completadas}<br>
        🔄 En proceso: ${datos.enProceso}<br>
        ⏳ Pendientes: ${datos.pendientes}
        `;
}

cargarTareas();
cargarCumplimiento();
</script>

</body>
</html>
